name: Publish verified v0.2.5

on:
  push:
    branches: [chatgpt-v025-publish]
    paths:
      - '.v025-final/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publish branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild staged source from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/v025-stage /tmp/v025-src
          mkdir -p /tmp/v025-stage /tmp/v025-src
          git archive --format=tar origin/main .v025-import | tar -xf - -C /tmp/v025-stage
          cat /tmp/v025-stage/.v025-import/part-*.b64 > /tmp/v025.b64
          base64 -d /tmp/v025.b64 > /tmp/v025.zip
          unzip -q /tmp/v025.zip -d /tmp/v025-src
          PKG="$(find /tmp/v025-src -type f -name package.json | head -n 1)"
          test -n "$PKG"
          SRC="$(dirname "$PKG")"
          test "$(node -p "require('$PKG').version")" = '0.2.5'
          echo "$SRC" > /tmp/v025-root

      - name: Verify exact source tree
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(cat /tmp/v025-root)"
          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import hashlib, sys
          root = Path(sys.argv[1])
          files = sorted((p for p in root.rglob('*') if p.is_file()), key=lambda p: p.relative_to(root).as_posix())
          h = hashlib.sha256()
          for p in files:
              rel = p.relative_to(root).as_posix().encode()
              h.update(rel + b'\0' + hashlib.sha256(p.read_bytes()).digest() + b'\n')
          digest = h.hexdigest()
          print(f'files={len(files)} tree_sha256={digest}')
          assert len(files) == 124, f'unexpected file count: {len(files)}'
          assert digest == '928c6ae4fab923a479bea78e615e8b3914f0af9f6491879f9cf6d509fe691386', digest
          PY

      - name: Run full test suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$(cat /tmp/v025-root)"
          npm test

      - name: Publish clean v0.2.5 source tree to main
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(cat /tmp/v025-root)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SRC"/. .
          git add -A
          git commit -m 'release: v0.2.5'
          git push origin main
